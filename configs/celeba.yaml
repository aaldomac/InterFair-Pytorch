output: experiments/celeba
model_seed_base: 1000
data_seeds: [0]
dataset:
  name: celeba
  kwargs:
    root: data/celeba
    target_attr: Smiling
    group_attrs: [Male, Young]
    image_size: 64
    download: false
conditions:
  baseline: {}
pipeline:
  n_models: 3
  append_protected_to_predictor: false
  loader: {batch_size: 64, eval_batch_size: 128}
  model: {dropout: 0.0}
  train: {epochs: 30, patience: 5, binary: true}
audit: {enabled: true, alpha: 0.05, fairness: true, distribution: true}
