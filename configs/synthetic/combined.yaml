output: experiments/loan_combined
model_seed_base: 1000
data_seeds:
- 0
- 1
conditions:
  no_bias:
    scenario: loan_no_bias
    uncertainty: null
  intersectional:
    scenario: loan_intersectional
    uncertainty: null
  no_bias_noise:
    scenario: loan_no_bias
    uncertainty:
      kind: noise
      eta: 0.3
      baseline_noise: 0.0
  intersectional_noise:
    scenario: loan_intersectional
    uncertainty:
      kind: noise
      eta: 0.3
      baseline_noise: 0.0
  intersectional_noise_scarcity:
    scenario: loan_intersectional
    uncertainty:
      kind: custom
      baseline_noise: 0.0
      flip_probability:
        '11': 0.3
      retention:
        '11': 0.25
pipeline:
  n_models: 10
  append_protected_to_predictor: false
  device: null
  model:
    hidden_dims:
    - 128
    - 64
    dropout: 0.0
  optimizer:
    lr: 0.001
    weight_decay: 0.0001
  loader:
    batch_size: 128
    eval_batch_size: 512
    shuffle_train: true
  train:
    epochs: 300
    patience: 30
    binary: true
    restore_best: true
    verbose: true
dataset:
  name: synthetic_data
  kwargs:
    train: 8000
    validation: 2000
    audit: 20000
    reference: 100000
    scenario: loan_no_bias
audit:
  enabled: true
  alpha: 0.05
  interaction_weights:
    '0': 1
    '1': -1
    '2': -1
    '3': 1
  fairness: true
  distribution: true
