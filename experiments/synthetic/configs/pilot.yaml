# Real-training pilot: 6 conditions x 2 data seeds x 10 members = 120 networks.
# Requires the float32 JSON fix in audit.py.
output: results/pilot
model_seed_base: 1000
data_seeds: [0, 1]
data:
  train: 2000
  validation: 500
  audit: 5000
  reference: 25000
conditions:
  baseline:
    scenario: baseline
  scarcity: {scenario: scarcity, rho: 0.125}
  noise: {scenario: noise, eta: 0.3}
  additive: {scenario: additive, strength: 0.2}
  interaction: {scenario: interaction, strength: 0.2}
  cancellation: {scenario: cancellation, eta: 0.3, rho: 0.125}
pipeline:
  n_models: 10
  append_protected_to_predictor: false
  device: null
  model: {hidden_dims: [128,64], dropout: 0.0}
  optimizer: {lr: 0.001, weight_decay: 0.0001}
  loader: {batch_size: 128, eval_batch_size: 512, shuffle_train: true}
  train: {epochs: 300, patience: 30, binary: true, restore_best: true, verbose: true}
